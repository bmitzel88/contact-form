<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="Stylesheet" herf="styles/contact-styles.css">
    <script src="js/form.js"></script>
</head>
<body>
    <div id="main">
        <div id="header">
            <h1>Contact Form</h1>
        </div>

        <form id="contact-form">
            <label for="fname">First Name</label>
            <input type="text" id="fname" name="fname">
            <span class="err" id="err-fname">First name is required</span>

            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lname">
            <span class="err" id="err-lname">Last name is required</span>

            <label for="jtitle">Job Title</label>
            <input type="text" id="jtitle" name="jtitle">
            <span class="err" id="err-jtitle">Job title is required</span>

            <label for="company">Company</label>
            <input type="text" id="company" name="company">
            <span class="err" id="err-company">Company is required</span>

            <label for="lkedIn">LinkedIn URL</label>
            <input type="url" id="lkedIn" name="lkedIn">
            <span class="err" id="err-lkedIn">LinkedIn URL is required</span>

            <label for="email">Email</label>
            <input type="email" id="email" name="email">
            <span class="err" id="err-email">Email is required</span>
        </form>
    </div>
    
</body>
</html>
